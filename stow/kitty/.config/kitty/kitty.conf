# ── kitty — Catppuccin Mocha / Pink ──────────────────────────────────────────
# Ported from the NixOS rice (dotfiles/kitty/kitty.conf.in). That version was a
# matugen template; here the palette is fixed, so this is a plain config with no
# render step. Colours: docs/palette.md.

# Don't nag when closing a window with nothing running.
confirm_os_window_close 0

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Feel
window_padding_width  10
cursor_shape          beam
cursor_blink_interval 0
scrollback_lines      10000
enable_audio_bell     no
background_opacity    1.0
# Remove the client-side titlebar/decorations.
hide_window_decorations yes
# Hide the tab bar entirely unless there are 2+ tabs.
tab_bar_min_tabs      2
tab_bar_edge          bottom
tab_bar_style         powerline
tab_title_template    "{index}: {title}"

# ── Colours ──────────────────────────────────────────────────────────────────
background           #1e1e2e
foreground           #cdd6f4
selection_background #f5c2e7
selection_foreground #1e1e2e
cursor               #f5c2e7
cursor_text_color    #1e1e2e
url_color            #89dceb

active_border_color   #f5c2e7
inactive_border_color #313244

active_tab_background   #f5c2e7
active_tab_foreground   #1e1e2e
inactive_tab_background #181825
inactive_tab_foreground #cdd6f4

# 16-colour ANSI — official Catppuccin Mocha. Unlike the lain rice (which pinned
# a hand-tuned palette while matugen drove the chrome), these now agree with the
# accent: magenta *is* the pink.
# black
color0  #45475a
color8  #585b70
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bac2de
color15 #a6adc8
